name: Publish to Maven Central

# Triggered by pushing a version tag (e.g. v0.1.0). The published version comes from the
# VERSION_NAME Gradle property; the workflow verifies that the tag matches it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # needed to create the GitHub Release below

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Guard against the exec bit being lost when gradlew is committed from Windows,
      # where core.fileMode is false and the mode silently reverts to 100644.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Verifies gradle-wrapper.jar has not been tampered with (supply-chain check).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # AGP needs a full JDK 17 (with jlink). Temurin provides it; this also satisfies the
      # Gradle daemon JVM criteria (gradle/gradle-daemon-jvm.properties -> toolchainVersion=17).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches library version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${version}" >&2
            exit 1
          fi

      - name: Verify release artifacts
        run: >-
          ./gradlew :nbn:testDebugUnitTest :nbn:lintRelease :nbn:assembleRelease
          :test:consumer:assembleRelease --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # Uploads + validates the deployment; a maintainer then clicks "Publish" in the
        # Central Portal. For fully automatic release, replace with:
        #   ./gradlew :nbn:publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        run: ./gradlew :nbn:publishToMavenCentral --no-configuration-cache --stacktrace

      - name: Create GitHub Release (attach AAR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: nbn/build/outputs/aar/*.aar
