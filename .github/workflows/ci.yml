name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar has not been tampered with (supply-chain check).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build library consumers
        run: >-
          ./gradlew :nbn:testDebugUnitTest :nbn:lintRelease :nbn:assembleRelease
          :test:consumer:assembleRelease :examples:app:assembleDebug --stacktrace
