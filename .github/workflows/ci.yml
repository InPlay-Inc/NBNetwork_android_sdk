name: CI

on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies gradle-wrapper.jar has not been tampered with (supply-chain check).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Builds the library and the sample app (compilation + resource + packaging checks).
      #
      # NOTE: `:sdk:testDebugUnitTest` is intentionally omitted. Some AdvParser tests call
      # android.util.Base64, which is not available in plain JVM unit tests (returns default
      # values), so they only pass under Robolectric/instrumented tests. Add Robolectric and
      # re-enable `:sdk:testDebugUnitTest` here once that is set up.
      - name: Build SDK and sample
        run: ./gradlew :sdk:assembleRelease :examples:app:assembleDebug --stacktrace
